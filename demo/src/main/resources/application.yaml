spring:
  application:
    name: movieflix

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update

  flyway:
    enabled: true

movieFlix:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: 3600000 # 1 hour in milliseconds